name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Зеркальность docs/en ↔ docs/ru и README.md ↔ README.ru.md. Только
  # встроенные модули Node — установка зависимостей не нужна.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check en/ru documentation parity
        run: node scripts/check-docs-parity.mjs
      # Нормативная часть ТЗ уезжает в пакет копией: проверяем, что копия не
      # отстала от `docs/spec.md`.
      - name: Check the package SPEC is generated from the specification
        run: node scripts/generate-spec.mjs --check

  # Линт, typecheck и юнит-тесты пакета, тесты корневых скриптов.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # `lint`, а не `lint:fix`: последний идёт с `--fix` и молча починил бы
      # нарушения, выйдя с нулём. Линт и typecheck от версии Node не зависят.
      - name: Lint
        if: matrix.node == 24
        run: yarn lint
      - name: Typecheck (with tests and configs)
        if: matrix.node == 24
        run: yarn typecheck
      - name: Test package
        run: yarn test
      - name: Test repository scripts
        if: matrix.node == 24
        run: yarn test:scripts

  # Сборка пакета, валидация метаданных и границ на `dist` (N-1, INV-DEP-1,
  # INV-BND-1, INV-BND-2). Артефакт уходит в публикацию по тегу.
  build:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Вендоренное ядро UnoCSS порождается скриптом; расхождение с
      # зафиксированным в git означает ручную правку (ADR-2).
      - name: Check vendored UnoCSS core is up to date
        run: yarn check:vendor
      # Оба пакета: ядро и движок. Порядок важен — движок берёт хелперы у ядра
      # как peer, и его сборка резолвит их через `dist/types` ядра.
      - name: Build packages
        run: yarn build
      - name: Validate package metadata (publint)
        working-directory: packages/granum
        run: npx --yes publint@latest --pack npm
      - name: Validate engine package metadata (publint)
        working-directory: packages/granum-engine-mini
        run: npx --yes publint@latest --pack npm
      # Границы проверяются на ядре: у движка вендоренный код внутри законен, а
      # у ядра его быть не должно вовсе (INV-ENG-9).
      - name: Check dependency and browser/node boundaries on dist
        run: yarn check:boundary
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granum-dist
          path: packages/granum/dist/
      - name: Upload engine dist
        uses: actions/upload-artifact@v7
        with:
          name: granum-engine-mini-dist
          path: packages/granum-engine-mini/dist/

  # Сквозная проверка контракта: пакет → фикстурные провайдеры → приложения,
  # затем `doctor` провайдеров, сверка CSS приложений и бюджет стендов.
  # До этапа 4 фикстур нет и шаги пропускаются штатно (`run-workspaces.mjs`).
  contract:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build package, fixtures and apps
        run: yarn build:all
      - name: Verify manifests of fixture providers
        run: yarn verify:fixtures
      - name: Rebuild fixtures and check manifests are byte-stable
        run: yarn check:determinism
      - name: Verify built CSS of apps
        run: yarn verify:apps
      - name: Compare bench-one CSS rules with the v1 snapshot (AC-2)
        run: yarn compare:css
      - name: Compare bench-one JS with a build without the plugin (AC-3)
        run: yarn compare:js
      - name: Verify size budget of benchmark stands
        run: yarn sizes:check

  # e2e на dev-сервере: INV-CSS-6 (утилита приложения перебивает базовый стиль
  # компонента) и AC-9 (правка разметки приезжает по HMR без перезагрузки). Оба
  # утверждения наблюдаемы только в браузере — ни снапшот CSS, ни отчёт сборки
  # их не подтверждают.
  e2e:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Dev-серверу нужен собранный пакет (приложение импортирует `./vite` из
      # `dist`) и манифесты фикстур; сами приложения собирать не нужно.
      - name: Build package and fixtures
        run: yarn build && yarn build:fixtures
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run e2e on the dev server
        run: yarn e2e

  # Публикация в npm по тегу `v<semver>`; зависит и от `contract`, и от `e2e`:
  # пакет, ломающий провайдеров, приложения или каскад в браузере, публиковать
  # нельзя.
  publish-npm:
    needs: [ build, contract, docs-parity, e2e ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Тег один на репозиторий, поэтому версии обоих пакетов обязаны ему
      # соответствовать: движок объявляет ядро своим peer по мажору и минору, и
      # разъехавшиеся версии дали бы неустановимую пару.
      - name: Verify tag matches both package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/granum packages/granum-engine-mini; do
            PKG_VERSION=$(node -p "require('./$dir/package.json').version")
            echo "$dir: $PKG_VERSION (tag $TAG_VERSION)"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $dir version $PKG_VERSION"
              exit 1
            fi
          done
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granum-dist
          path: packages/granum/dist
      - name: Download engine dist
        uses: actions/download-artifact@v8
        with:
          name: granum-engine-mini-dist
          path: packages/granum-engine-mini/dist
      # Ядро первым: движок ссылается на него как на peer, и порядок публикации
      # определяет, что увидит потребитель, поставивший пару сразу после релиза.
      - name: Publish core to npm
        run: npm publish --access public --provenance
        working-directory: packages/granum
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish engine to npm
        run: npm publish --access public --provenance
        working-directory: packages/granum-engine-mini
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
